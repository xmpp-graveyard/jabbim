[header]
'type'='chatskin'
'name'='Psi based chatskin'
'license'='GPL'
'version'='0.1'
'author'='Jan Kaluža'
'description'='Psi based chatskin'
[chatskin]
my_message='<font color="red">[[time]] &lt;[user]&gt;</font> [message]<br/><br/>'

message='<font color="[foreground]">[[time]] &lt;[user]&gt;</font> [message]<br/><br/>'

message_for_me='<font color="[foreground]">[[time]] &lt;[user]&gt;</font><font color="red"> [message]</font><br/><br/>'

me_message='<font color="[foreground]">[[time]] &lt;[user]&gt; [message]</font><br/><br/>'

my_me_message='<font color="red">[[time]] &lt;[user]&gt; [message]</font><br/><br/>'

status_message='<font color="#1eaa1e">[[time]] *** [message]</font><br/><br/>'

gc_status_message='<font color="#1eaa1e">[[time]] &lt;[nick]&gt; is now [show] [[message]]</font><br/><br/>'

my_message_history='<font size="-1"><font color="red">[[time]] &lt;[user]&gt;</font> [message]</font><br/><br/>'

message_history='<font size="-1"><font color="[foreground]">[[time]] &lt;[user]&gt;</font> [message]<br/><br/>'

message_for_me_history='<font size="-1"><font color="[foreground]">[[time]] &lt;[user]&gt;</font><font color="red"> [message]</font></font><br/><br/>'

status_message_history='<font size="-1"><font color="#1eaa1e">[[time]] *** [message]</font></font><br/><br/>'

color1="#0000ff","#FFE4E4" # cervena
color2="#c000ff","#EDCDFF" # fialova
color4="#388a99","#DFFFF9" # tyrkysova
color5="#045723","#DFFFE5" # tmave zelena
color6="#7c7c7c","#F6F6F6" # seda
color7="#ff8a00","#FFFFC9" # oranzova
color8="#94452d","#FFE2D4" # tmave hneda
